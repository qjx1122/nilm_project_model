# 调参专题 Phase2 组合泳道 tune_c_d0lr1e3：Phase1 双胜出因子 dropout=0 + lr 探边；公共口径同 Phase1
seed: 42
device: cpu
data:
  path: ''
  appliance: kettle
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 8000
  max_samples_val: 4000
  max_samples_test: 4000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 12
  lr: 0.001
  weight_decay: 0.0001
  patience: 4
  grad_clip: 1.0
  loss: mse
metrics:
  on_threshold_watts: 500.0
