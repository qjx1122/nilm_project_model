# 攻坚 F13: F11 全长配方复现,仅换 seed=43——验证 26FP/28FN 硬骨头是否跨种子重合;胜者=种子间 max 集成冲 .90 线
seed: 43
device: cpu
data:
  path: ''
  appliance: kettle
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 8000
  max_samples_test: 30000
  event_boost:
    threshold_w: 500.0
    max_extra: 15000
    stochastic_epochs: true
    event_frac: 0.45
model:
  input_dim: 1
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.0
training:
  batch_size: 64
  epochs: 30
  lr: 0.0004
  weight_decay: 0.0001
  patience: 10
  grad_clip: 1.0
  loss: mse
  lr_schedule: cosine
  weight_avg: 4
metrics:
  on_threshold_watts: 500.0
