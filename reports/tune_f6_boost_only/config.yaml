# F6 消融: 仅事件分层boost(λ=1,选点val MAE)——隔离F5双改动
seed: 42
device: cpu
data:
  path: ''
  appliance: kettle
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 8000
  max_samples_test: 30000
  event_boost:
    threshold_w: 500.0
    max_extra: 15000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  lr_schedule: cosine
metrics:
  on_threshold_watts: 500.0
