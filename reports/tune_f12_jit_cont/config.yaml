# 攻坚 F12: 热启动自 F11(=F10全长,无jitter) 终权重 + roll_jitter=2 续训12ep
seed: 42
device: cpu
data:
  path: ''
  appliance: kettle
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 8000
  max_samples_test: 30000
  event_boost:
    threshold_w: 500.0
    max_extra: 15000
    stochastic_epochs: true
    event_frac: 0.45
  roll_jitter: 2
model:
  input_dim: 1
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.0
training:
  batch_size: 64
  epochs: 12
  lr: 0.0003
  weight_decay: 0.0001
  patience: 12
  grad_clip: 1.0
  loss: mse
  lr_schedule: cosine
  weight_avg: 4
  init_ckpt: reports/tune_f11_big_jit/best.pt
metrics:
  on_threshold_watts: 500.0
