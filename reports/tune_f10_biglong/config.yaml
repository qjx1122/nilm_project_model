# 攻坚 F10: F8 全长版——30ep/patience10 防再被截杀，wavg 完整执行，其余与 F8 相同
seed: 42
device: cpu
data:
  path: ''
  appliance: kettle
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 8000
  max_samples_test: 30000
  event_boost:
    threshold_w: 500.0
    max_extra: 15000
    stochastic_epochs: true
    event_frac: 0.45
model:
  input_dim: 1
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.0
training:
  batch_size: 64
  epochs: 30
  lr: 0.0004
  weight_decay: 0.0001
  patience: 10
  grad_clip: 1.0
  loss: mse
  lr_schedule: cosine
  weight_avg: 4
metrics:
  on_threshold_watts: 500.0
