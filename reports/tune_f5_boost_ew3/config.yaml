# F5 主泳道: F4-ew3 + 事件分层采样(补看真实事件, 上限+15k窗口)——诊断表明52个FN的pred≈10W,模型没见过足够事件
seed: 42
device: cpu
data:
  path: ''
  appliance: kettle
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 8000
  max_samples_test: 30000
  event_boost:
    threshold_w: 500.0
    max_extra: 15000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.0
training:
  batch_size: 128
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  loss: mse
  lr_schedule: cosine
  event_weight: 3.0
  select_on: f1
metrics:
  on_threshold_watts: 500.0
