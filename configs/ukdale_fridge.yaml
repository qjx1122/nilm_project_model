# 由 baseline.yaml 派生：仅改 appliance 与 ON 阈值（fridge 压缩机 ~90-250W，阈值须低于 500W）
seed: 42
device: auto
data:
  path: data/ukdale_house1_fridge.npz
  appliance: fridge
  window_size: 128
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_samples_train: 30000
  max_samples_val: 6000
  max_samples_test: 6000
model:
  input_dim: 1
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1
training:
  batch_size: 128
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0001
  patience: 7
  grad_clip: 1.0
  loss: mse
metrics:
  on_threshold_watts: 30.0
